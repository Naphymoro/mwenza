# Mwenza's model on Workers AI (src/index.ts), called by DeerFlow's gateway. Deploy:
#   npm install && npx wrangler d1 migrations apply mwenza-ai-usage --remote && npx wrangler deploy
#   npx wrangler secret put MWENZA_AI_TOKEN      (the same value goes in DeerFlow's .env)
name = "mwenza-ai"
main = "src/index.ts"
compatibility_date = "2026-09-30"
workers_dev = true

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "mwenza-ai-usage"
database_id = "62a0cf67-f522-44c4-b60d-b07084af3c63"
migrations_dir = "migrations"

[vars]
MWENZA_AI_MODEL = "@cf/zai-org/glm-5.3-flash"
# Workers AI's free 10,000 Neurons a day are per account, and NDIM caps itself at 9,000.
MWENZA_AI_DAILY_NEURONS = "3000"
