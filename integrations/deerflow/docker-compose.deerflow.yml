# Mwenza's MCP server beside a DeerFlow that runs in Docker. Container to container only: the host firewall
# drops container-to-host traffic, and nothing here is published on the host.
#
#   docker compose -f integrations/deerflow/docker-compose.deerflow.yml up -d --build      (run from the mwenza repo)
#
# The DeerFlow dev stack must be up first: it creates the external network below.
# DeerFlow config (install.sh adds it): "type": "http", "url": "http://mwenza-mcp:8766/mcp"
#
# Optional settings come from the shell or an .env file next to this compose file:
#   MWENZA_OPENALEX_KEY    an OpenAlex API key (higher rate limits)
#   MWENZA_CONTACT_EMAIL   sent to OpenAlex and Crossref for their polite pool
name: mwenza-deerflow

services:
  mwenza-mcp:
    build:
      context: ../../backend
      dockerfile: ../integrations/deerflow/Dockerfile.mcp
    environment:
      MWENZA_OPENALEX_KEY: ${MWENZA_OPENALEX_KEY:-}
      MWENZA_CONTACT_EMAIL: ${MWENZA_CONTACT_EMAIL:-}
    networks: [deerflow]
    restart: unless-stopped

networks:
  deerflow:
    external: true
    name: deer-flow-dev_deer-flow-dev
