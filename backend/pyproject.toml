[project]
name = "mwenza-engine"
version = "0.1.0"
description = "Evidence-first ingestion, retrieval, provenance, and knowledge graph engine for Mwenza."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pymupdf>=1.24",
  "pydantic>=2.8",
  "httpx>=0.27",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.13", "Pillow>=10.4"]
vectors = ["sentence-transformers>=3.0"]
mcp = ["mcp>=2.3,<3"]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.scripts]
mwenza-mcp = "mwenza_engine.mcp_server:main"
